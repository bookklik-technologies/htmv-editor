name: Deploy app and documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build standalone app
        run: npm run build
      - name: Build documentation
        run: npm run docs:build
        env:
          VITEPRESS_BASE: /htmv-editor/docs/
      - name: Assemble Pages site
        run: |
          mkdir -p _site/docs
          cp -a app/. _site/
          cp -a docs/.vitepress/dist/. _site/docs/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
